name: test

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Compile Python pipeline
        run: python -m compileall -q scripts tests

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Check ingestion CLIs
        run: |
          python scripts/ingest_icml_pmlr.py --help >/dev/null
          python scripts/ingest_miccai.py --help >/dev/null
          python scripts/update_database.py --help >/dev/null

      - name: Build browser catalog
        run: python scripts/build_web_catalog.py --input artifacts/papers_features.parquet --output web/data

      - name: Validate frontend JavaScript
        run: node --check web/app.js

      - name: Validate catalog and public files
        run: |
          test -f web/index.html
          test -f web/privacy.html
          test -f web/terms.html
          test -f web/data/manifest.json
          test -f web/data/index-2026.json
          python - <<'PY'
          import json
          from pathlib import Path

          manifest = json.loads(Path("web/data/manifest.json").read_text())
          assert manifest["num_papers"] == 67343, manifest
          assert manifest["num_clusters"] == 120, manifest
          assert 2026 in manifest["years"], manifest
          print(manifest)
          PY

      - name: Enforce privacy invariants
        run: |
          if grep -En 'localStorage|sessionStorage|indexedDB|document\.cookie' web/app.js; then
            echo "Persistent browser storage or cookies are not allowed in the public app."
            exit 1
          fi
          if grep -En "<script[^>]+src=['\"]https?://" web/*.html; then
            echo "Third-party script tags are not allowed."
            exit 1
          fi
          if grep -Ein 'google-analytics|gtag\(|segment\.com|mixpanel|posthog|stripe|paddle|lemonsqueezy|paypal' web/app.js web/index.html; then
            echo "Analytics, payment, or subscription SDKs are not allowed."
            exit 1
          fi
